<!DOCTYPE html>
<html>
<head>
  <title>Edit Record</title>
</head>
<body>
  <h1>Edit Record #{{ id }}</h1>
  <form method="POST">
    Date: <input type="date" name="date" value="{{ date }}" required><br><br>
    Saving: <input type="number" step="0.01" name="saving" value="{{ saving }}" required><br><br>
    Expense: <input type="number" step="0.01" name="expense" value="{{ expense }}" required><br><br>
    <button type="submit">Update</button>
  </form>
  <br><a href="/history">⬅️ Back</a>
</body>
</html>
